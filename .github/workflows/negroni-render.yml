name: Rendu Negroni 360

# Rendu pré-calculé (Blender Cycles) du Negroni pour le menu Progress.
# Ne tourne que sur la branche de travail du rendu, jamais sur main.
# Les images sont calculées en plusieurs morceaux en parallèle, puis rassemblées
# (images WebP de la rotation, vidéos MP4/WebM d'aperçu, images fixes JPEG) et enregistrées dans render/negroni/out/.
on:
  push:
    branches: [claude/project-thread-5zlo96]
    paths: ['render/negroni/job.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: negroni-render
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          n=$(python3 -c "import json;print(json.load(open('render/negroni/job.json'))['chunks'])")
          echo "chunks=$(python3 -c "print(list(range($n)))")" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: render/negroni/requirements.txt
      - name: Bibliothèques système pour Blender
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 > /dev/null
      - name: Blender (module Python)
        run: pip install -q -r render/negroni/requirements.txt
      - name: Rendu du morceau ${{ matrix.chunk }}
        run: python render/negroni/run_job.py ${{ matrix.chunk }}
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk }}
          path: render-out/*.png
          retention-days: 7
      - name: Fichiers EXR (pour un réétalonnage sans recalcul, gardés 7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: exr-${{ matrix.chunk }}
          path: render-out/*.exr
          retention-days: 7
          compression-level: 0

  collect:
    needs: render
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          path: render-out
          pattern: frames-*
          merge-multiple: true
      - name: Encodage (WebP, vidéos d'aperçu, images fixes)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
          python render/negroni/collect.py render-out
      - name: Enregistrer le résultat sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add render/negroni/out
          git commit -m "Rendu Negroni : résultat du calcul $(date -u +%Y-%m-%dT%H:%MZ)" || echo "rien à enregistrer"
          for i in 1 2 3 4; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*5)); done
