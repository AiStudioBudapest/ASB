<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Teszt Oldal — restaurant de haute gastronomie à Paris. Une cuisine en mouvement, une expérience hors du temps. Menu dégustation, réservation."
    />
    <meta name="color-scheme" content="dark" />
    <title>Teszt Oldal — Restaurant Gastronomique, Paris</title>
    <!-- Matches src/index.css's --bg/--accent exactly (hsl(), not a hand
         converted hex, so there's zero chance of a mismatched flash once
         that stylesheet loads) and a small loading spinner — shown the
         instant the HTML parses, well before the JS bundle downloads/
         parses/mounts React and LoadingScreen takes over. Without this, a
         full-page navigation here (as opposed to the alexstudio embed,
         which skips LoadingScreen via ?embed=1) sat on a bare black tab
         for a few seconds with nothing on it while the bundle loaded —
         this fills that gap. A spinner, not a pulsing status dot: it
         reads unambiguously as "loading", rather than as a fake liveness
         indicator with nothing real behind it. Lives inside #root, so
         React's first render replaces it automatically; nothing to clean
         up manually. -->
    <script>
      // Inside the alexstudio showcase (?embed=1) the page is a thumbnail, so
      // its own scrollbar would show up as a dark bar down the right edge.
      if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');
    </script>
    <style>
      html.embed{scrollbar-width:none;}
      html.embed::-webkit-scrollbar{display:none;}
      html,body{background:hsl(30 8% 4%);margin:0;}
      #initial-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:hsl(30 8% 4%);}
      #initial-loader .spinner{width:22px;height:22px;border-radius:50%;
        border:2px solid hsl(38 45% 62% / .25);border-top-color:hsl(38 45% 62%);
        animation:initial-loader-spin .8s linear infinite;}
      @keyframes initial-loader-spin{to{transform:rotate(360deg);}}
      @media (prefers-reduced-motion: reduce){#initial-loader .spinner{animation:none;}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><div id="initial-loader" aria-hidden="true"><span class="spinner"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
